<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7rb Store</title>
    <style>
        body {
            background-color: #0b0b12;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            color: #a855f7;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            font-size: 1.2rem;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: #161623;
            border: 1px solid #8a2be2;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
        }
        .price {
            color: #a855f7;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 15px 0;
        }
        .btn {
            background: #8a2be2;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>7rb Store ⚡</h1>
    <p>متجر سبع للخدمات البرمجية وبوتات الديسكورد</p>

    <div class="grid">
        <div class="card">
            <h3>🤖 بوت ديسكورد متكامل</h3>
            <p>إدارة، تكتات، وتخصيص كامل.</p>
            <div class="price">50 SAR</div>
            <a href="#" class="btn">طلب الان</a>
        </div>

        <div class="card">
            <h3>⚡ سكريبتات iSH & Terminal</h3>
            <p>أدوات فحص وتوليد وبانرات ASCII.</p>
            <div class="price">30 SAR</div>
            <a href="#" class="btn">طلب الان</a>
        </div>
    </div>

</body>
</html>
