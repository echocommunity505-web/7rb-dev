<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7rb Store | المتجر الرسمي</title>

    <!-- خط كايرو الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #09090e;
            --card-bg: rgba(18, 18, 29, 0.75);
            --border-purple: rgba(138, 43, 226, 0.3);
            --accent-purple: #8a2be2;
            --neon-glow: #a855f7;
            --text-white: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
        }

        /* الهيدر */
        header {
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(9, 9, 14, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-purple);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-white);
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        .logo span {
            color: var(--neon-glow);
        }

        .discord-btn-head {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid var(--neon-glow);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .discord-btn-head:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* الهيرو */
        .hero {
            text-align: center;
            padding: 70px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(138, 43, 226, 0.15);
            border: 1px solid var(--border-purple);
            color: var(--neon-glow);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 40%, var(--neon-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            line-height: 1.7;
        }

        /* شبكة المنتجات */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 80px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 25px;
            background: var(--neon-glow);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-purple);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-glow), transparent);
            opacity: 0;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-glow);
            box-shadow: 0 15px 30px rgba(138, 43, 226, 0.25);
        }

        .product-card:hover::before {
            opacity: 1;
        }

            position: absolute;
