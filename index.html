<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7rb Store</title>
    <style>
        body {
            background-color: #0b0b12;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #a855f7;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            font-size: 1.1rem;
        }
        .card {
            background: #161623;
            border: 2px solid #8a2be2;
            border-radius: 15px;
            padding: 30px;
            max-width: 350px;
            margin: 40px auto;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }
        .price {
            color: #a855f7;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 20px 0;
        }
        .btn {
            background: #8a2be2;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>7rb Store ⚡</h1>
    <p>متجر سبع للخدمات البرمجية وبوتات الديسكورد</p>

    <div class="card">
        <h2>🤖 بوت ديسكورد متكامل</h2>
        <p>إدارة، تكتات، وتخصيص كامل للسيرفر.</p>
        <div class="price">50 SAR</div>
        <a href="#" class="btn">طلب المنتج</a>
    </div>

</body>
</html>
