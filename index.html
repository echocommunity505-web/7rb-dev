    <title>7rb Store | متجر سبع</title>
    <style>
        * {
            box-sizing: border-box;

        body {
            background-color: #0d0d15;
            color: #ffffff;
            text-align: center;
            padding-bottom: 50px;

        .top-bar {
            background: linear-gradient(90deg, #6366f1, #a855f7);

        }

        header {
            background: #141422;
            padding: 20px;

            align-items: center;

            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;

        }

        .logo span {

        }

        .hero {

            border: 1px solid #8a2be2;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .hero p {
            color: #a1a1aa;
            font-size: 16px;
        }

        /* شبكة المنتجات */

            padding: 0 20px;
        }

        }

        }
